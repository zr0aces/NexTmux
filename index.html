<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TmuxHub — Premium Tmux Workspace Manager</title>
<meta name="description" content="A lightweight, real-time developer terminal dashboard and workspace manager powered by Tmux and active monitoring.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cline x1='16' y1='4' x2='16' y2='28' stroke='%23334155' stroke-width='2'/%3E%3Cpath d='M6 10 L10 13 L6 16' fill='none' stroke='%23ea580c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='20' y='19' width='6' height='2' fill='%2338bdf8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=2026.5.15">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-logo-wrap">
      <svg class="login-logo-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0d111c"/>
        <line x1="16" y1="4" x2="16" y2="28" stroke="#1e293b" stroke-width="2"/>
        <path d="M6 10 L10 13 L6 16" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="19" width="6" height="2" fill="#38bdf8"/>
      </svg>
      <h2>TmuxHub</h2>
    </div>
    <p class="login-subtitle">Tmux Workspace Manager <span class="login-version">v2026.5.15</span></p>
    
    <div class="login-input-group">
      <input id="pw" type="password" placeholder="Enter Access Password..." />
    </div>
    
    <label class="login-remember">
      <input id="remember-pw" type="checkbox" />
      Remember Password
    </label>
    
    <button id="login-btn">Unlock Dashboard</button>
    <button id="clear-saved-pw-btn" class="login-secondary-btn" type="button" style="display:none">Clear Saved Key</button>
    
    <span id="login-err">Incorrect password</span>
  </div>
</div>

<div id="app" style="display:none;flex-direction:column;height:100dvh;overflow:hidden">
  <header>
    <div class="brand-wrap">
      <div id="status-dot" class="off"></div>
      <svg class="brand-logo-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0d111c"/>
        <line x1="16" y1="4" x2="16" y2="28" stroke="#1e293b" stroke-width="2"/>
        <path d="M6 10 L10 13 L6 16" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="19" width="6" height="2" fill="#38bdf8"/>
      </svg>
      <h1>TmuxHub</h1>
      <span class="app-version">v2026.5.15</span>
    </div>
    <div class="layout-group">
      <button id="layout-tab-btn" class="header-btn layout-active">Tab</button>
      <button id="layout-split-btn" class="header-btn">Split</button>
    </div>
    <div class="header-divider"></div>
    <button id="scan-btn" class="header-btn">🔍</button>
    <button id="toggle-toolbar-btn" class="header-btn accent">+</button>
  </header>

  <div class="toolbar" id="spawn-toolbar" style="display:none">
    <input id="cmd-input" placeholder="Command" value="claude" />
    <div class="dir-wrap">
      <input id="cwd-input" placeholder="Working directory" />
      <div class="dir-dropdown" id="dir-dropdown">
        <div class="dir-section">⭐ Favorites</div>
        <div id="fav-list"></div>
        <div class="add-fav" id="add-fav-btn">+ Add current path to favorites</div>
        <div class="dir-section">🕐 Recent</div>
        <div id="recent-list"></div>
      </div>
    </div>
    <button id="dir-btn">📁</button>
    <button id="spawn-btn" class="primary">+ New</button>
  </div>

  <!-- Tab mode -->
  <div id="tab-mode" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div id="tab-bar"></div>
    <div id="tab-content"></div>
  </div>

  <!-- Split mode -->
  <div id="split-mode" style="flex:1;overflow:hidden;display:none">
    <div id="split-content"></div>
  </div>
</div>

<script src="/js/ansi.js?v=2026.5.15"></script>
<script src="/js/layout.js?v=2026.5.15"></script>
<script src="/js/favorites.js?v=2026.5.15"></script>
<script src="/js/ws.js?v=2026.5.15"></script>
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui-slim.min.js"></script>
<script src="/js/git-diff.js?v=2026.5.15"></script>
<script src="/js/workers.js?v=2026.5.15"></script>
<script src="/js/app.js?v=2026.5.15"></script>
</body>
</html>
